name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # AR HDL BUSPRO is proprietary software (see LICENSE). HACS requires
          # an OSI-approved licence for inclusion in its default store, which
          # this repository cannot satisfy by design. The licence check runs
          # only inside this action -- it is never run by Home Assistant -- so
          # ignoring it here does not affect anyone installing the integration
          # as a HACS custom repository, which is the supported route.
          ignore: "license"
