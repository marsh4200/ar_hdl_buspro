name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: What's missing or annoying today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered (optional)
